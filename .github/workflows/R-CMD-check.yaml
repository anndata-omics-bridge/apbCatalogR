# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Runs R CMD check (which runs the testthat suite) and BiocCheck on pushes to main and on
# pull requests, so changes are validated before they land upstream.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # "always" also routes macOS through Posit Package Manager. Workaround:
          # CRAN's macOS builder now ships zstd-compressed .tgz binaries, which the
          # pak/pkgdepends version this action installs cannot extract
          # (https://github.com/r-lib/pkgdepends/issues/485). P3M still serves gzip.
          # Revert to "true" once pkgdepends understands zstd archives.
          use-public-rspm: always

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Run BiocCheck
        if: ${{ runner.os == 'Linux' }}
        run: |
          install.packages("BiocManager")
          BiocManager::install("BiocCheck")
          BiocCheck::BiocCheck(".", `quit-with-status` = TRUE, `no-check-bioc-help` = TRUE)
        shell: Rscript {0}
